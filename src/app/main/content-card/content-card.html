<div class="container-fluid pt-3 no-gutters d-flex justify-content-center">
  <div class="content-card-container py-3 py-sm-2"
       [ngClass]="{'content-card-container-visible': this.visible}"
       [ngStyle]="{'box-shadow': this.innerWidth < 576 ? '14px 14px 0 0 #4F4A3A':'7px 7px 0 0 #4F4A3A'}">
    <div class="row no-gutters">
      @if (currentContent()) {
        <div class="col-auto no-gutters d-flex align-items-center">
          <div class="content-card-play-hook"></div>
        </div>
      }
      <div class="col no-gutters">
        <div class="row no-gutters">
          <div class="col no-gutters px-4 py-3">
            <span class="content-card-title-text">{{ content.title }}</span>
          </div>
          @if (currentContent()) {
            <div class="col-auto no-gutters d-flex justify-content-end align-items-center">
            <span [ngClass]="{'content-card-playing-text-tag-visible': currentContent()}"
                  class="content-card-playing-text-tag ps-4 pe-4 pb-3">Playing</span>
            </div>
          }
        </div>
        <div class="row no-gutters px-4 pb-3">
          <div class="col no-gutters">
            <span class="content-card-description-text">{{ content.description }}</span>
          </div>
        </div>
        <div class="row no-gutters pb-3">
          <div class="col-auto no-gutters ps-4 d-flex align-items-center">
            <div class="content-card-button px-3 d-flex justify-content-center align-items-center"
                 (click)="handleLoad()">
              @if (this.playing && currentContent()) {
                <div class="row no-gutters d-flex align-items-center">
                  <div class="col no-gutters">
                    PAUSE
                  </div>
<!--                  <div class="col no-gutters ps-1">-->
<!--                    <svg width="10" height="15" viewBox="0 0 10 15" fill="none" xmlns="http://www.w3.org/2000/svg">-->
<!--                      <rect width="3.75" height="14.375" fill="#92882F"/>-->
<!--                      <rect x="6.25" width="3.75" height="14.375" fill="#92882F"/>-->
<!--                    </svg>-->
<!--                  </div>-->
                </div>
              }
              @else {
                <div class="row no-gutters d-flex align-items-center">
                  <div class="col no-gutters">
                    PLAY
                  </div>
<!--                  <div class="col no-gutters ps-1">-->
<!--                    <svg width="15" height="15" viewBox="0 0 15 15" fill="none" xmlns="http://www.w3.org/2000/svg">-->
<!--                      <path d="M1.25 0L13.75 7.5L1.25 15V0Z" fill="#92882F"/>-->
<!--                    </svg>-->
<!--                  </div>-->
                </div>
              }
            </div>
          </div>
          <div class="col no-gutters ps-3 d-flex justify-content-start align-items-center">
            <div class="row no-gutters">
              <div class="col-auto no-gutters">
          <span [ngClass]="{'content-card-elapsed-and-total-time-active': this.audioGlobal.content?.uuid === this.content?.uuid}"
                class="content-card-elapsed-and-total-time">{{ this.elapsedOrSavedTime }}</span>
              </div>
              <div class="col-auto no-gutters">
          <span [ngClass]="{'content-card-elapsed-and-total-time-active': this.audioGlobal.content?.uuid === this.content?.uuid}"
                class="content-card-elapsed-and-total-time">/</span>
              </div>
              <div class="w-100 d-sm-none d-block"></div>
              <div class="col-auto no-gutters">
          <span [ngClass]="{'content-card-elapsed-and-total-time-active': this.audioGlobal.content?.uuid === this.content?.uuid}"
                class="content-card-elapsed-and-total-time">{{ TimeUtils.formatTime(this.content.duration) }}</span>
              </div>
            </div>
          </div>
          <div class="col no-gutters ps-4 pt-1 pe-3 d-flex "
               [ngClass]="{'justify-content-end': this.innerWidth >= 576, 'justify-content-start': this.innerWidth < 576}">
            <a [href]="this.apiUrl + '/download/' + this.content.filename" style="text-decoration: none">
              <div class="content-card-button px-3 d-flex justify-content-center align-items-center">DOWNLOAD</div>
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
