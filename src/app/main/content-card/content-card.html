<div class="container-fluid p-0 m-0 d-flex justify-content-center">
  <div class="card-container">
    <div class="row p-0 m-0">
      <div class="col p-0 m-0 px-4 py-3">
        <span class="title-text">{{content.title}}</span>
      </div>
        <div class="col-auto p-0 m-0 d-flex justify-content-end align-items-center">
          <span [ngClass]="{'playing-text-visible':this.globalData.content === this.content}" class="playing-text pe-4">Playing</span>
        </div>
    </div>
    <div class="row p-0 m-0">
      <div class="col p-0 m-0 px-4 pb-3">
        <span class="description-text">{{content.description}}</span>
      </div>
    </div>
    <div class="row p-0 m-0 pb-3">
      <div class="col p-0 m-0 ps-4 pb-3">
        <div class="button px-3 d-flex justify-content-center align-items-center"
             (click)="handleLoad()">
          @if (this.globalData.playing && this.content === this.globalData.content) {
            PAUSE
          }
          @else {
            PLAY
          }

        </div>
      </div>
      <div  class="col p-0 m-0 pb-3 d-flex justify-content-start align-items-center">
        <div class="row p-0 m-0">
          <div class="col p-0 m-0">
            <span [ngClass]="{'time-duration-active': this.globalData.content === this.content}" class="time-duration">{{ this.time }}</span>
          </div>
          <div class="col p-0 m-0">
            <span [ngClass]="{'time-duration-active': this.globalData.content === this.content}" class="time-duration">/</span>
          </div>
          <div class="col p-0 m-0">
            <span [ngClass]="{'time-duration-active': this.globalData.content === this.content}" class="time-duration">{{this.formatTime(this.content.duration)}}</span>
          </div>
        </div>
      </div>
      <div class="col p-0 m-0 px-4 pb-3">
        <a [href]="this.apiUrl + '/download/' + this.content.filename" style="text-decoration: none"><div class="button px-3 d-flex justify-content-center align-items-center">DOWNLOAD</div></a>
      </div>
    </div>
  </div>
</div>
