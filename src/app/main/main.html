<div class="container-fluid p-0 m-0">
  <div class="app-container">
    <div class="row p-0 m-0">
      <div class="col p-0 m-0">
        <div class="content-card">
          @for (data of dataList; track data.uuid) {
            <div class="row">
              <div class="col">
                <app-content-card [data]="data"></app-content-card>
              </div>
            </div>
          }
        </div>
      </div>
    </div>
  </div>
</div>
