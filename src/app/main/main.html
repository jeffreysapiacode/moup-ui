<div class="container-fluid p-0 m-0">
  <div class="app-container">
    <div class="row p-0 m-0">
      <div class="col p-0 m-0">
        <div class="content-card-container pt-3">
          @if (this.dataList.length === 0) {
            No Data Here
          }
          @if (this.dataList.length > 0) {
            @for (data of dataList; track data.uuid) {
              <div class="content-card">
                <div class="row p-0 m-0 pb-3 px-3">
                  <div class="col p-0 m-0">
                    <app-content-card [data]="data"></app-content-card>
                  </div>
                </div>
              </div>
            }
          }
          <img class="app-container-background" src="assets/img/svg/wave-blue.svg"/>

        </div>
      </div>
    </div>
  </div>
</div>
